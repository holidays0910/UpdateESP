<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>B-Connect Live Tracker</title>
    
    <!-- Leaflet CSS for Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet Routing Machine CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    
    <style>
        /* V23.1 SPLIT-SCREEN LAYOUT FIX */
        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: Arial, sans-serif; background-color: #121212;
            display: flex; flex-direction: column; /* Ginawang split-screen pataas-pababa */
        }
        
        #map { 
            flex: 1; /* Kukunin ang natitirang space sa itaas (nasa 40-50%) */
            width: 100vw; 
            z-index: 1; 
            min-height: 40vh;
        }
        
        .dashboard {
            height: 55vh; /* Ang ibabang 55% ay para sa dashboard */
            overflow-y: auto; /* Scrollable pataas-pababa */
            width: 100%;
            background: #1a1a1a; 
            color: #fff;
            padding: 15px; 
            box-sizing: border-box;
            border-top: 2px solid #333;
        }

        .dashboard-content {
            max-width: 500px; 
            margin: 0 auto;
        }

        h3 { margin: 0 0 10px 0; color: #29b6f6; text-align: center; font-size: 18px; }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .info-label { color: #aaa; }
        .info-val { font-weight: bold; text-align: right; }
        
        .status-locked { color: #ff1744; }
        .status-unlocked { color: #00e676; }
        .status-engine { color: #ffb300; }
        
        /* Itinatago nito yung malaking text box ng direksyon sa kalsada para malinis tingnan */
        .leaflet-routing-container { display: none !important; }
        
        .loading-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #121212; color: #00e676; display: flex;
            justify-content: center; align-items: center; z-index: 1000;
            font-size: 18px; font-weight: bold;
        }

        /* Share Button Style */
        .share-btn {
            width: 100%; background: #00e676; color: #000;
            padding: 10px; margin-top: 10px; border: none;
            border-radius: 8px; font-size: 14px; font-weight: bold;
            cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* CLOUD CONTROL STYLES */
        #terminalLog {
            width: 100%; height: 120px; background: #000; color: #00ff00; 
            border: 1px solid #333; margin-top: 10px; padding: 8px; 
            text-align: left; font-family: monospace; overflow-y: scroll; 
            white-space: pre-wrap; font-size: 11px; box-sizing: border-box; border-radius: 5px;
        }
        .cloud-section { margin-top: 15px; border-top: 1px solid #444; padding-top: 10px; }
    </style>
</head>
<body>

    <div id="loading" class="loading-screen">
        Kumokonekta sa Tracker...
    </div>

    <!-- MAP SECTION (NASA ITAAS) -->
    <div id="map"></div>

    <!-- DASHBOARD SECTION (NASA IBABA, SCROLLABLE) -->
    <div class="dashboard">
        <div class="dashboard-content">
            <h3>Live Telemetry</h3>
            <div class="info-row">
                <span class="info-label">System Status:</span>
                <span class="info-val" id="ui-status">WAITING...</span>
            </div>
            <div class="info-row">
                <span class="info-label">Layo mo sa Motor:</span>
                <span class="info-val" id="ui-distance" style="color:#ffb300;">Kinakalkula...</span>
            </div>
            <div class="info-row">
                <span class="info-label">Main Battery:</span>
                <span class="info-val" id="ui-battery">-- V</span>
            </div>
            <div class="info-row">
                <span class="info-label">Last Updated:</span>
                <span class="info-val" id="ui-time">--:--:--</span>
            </div>
            
            <button class="share-btn" onclick="shareLocation()">📍 SHARE LIVE LOCATION</button>

            <!-- ============================================================== -->
            <!-- V23.1 CLOUD CONTROL SECTION -->
            <!-- ============================================================== -->
            <div class="cloud-section">
                <h3 style="color:#ab47bc; font-size: 16px;">Cloud Remote Control</h3>
                
                <button id="authBtn" class="share-btn" style="background:#ab47bc; color:#fff;" onclick="toggleAuth()">🔐 LOGIN</button>
                
                <div id="controlButtons" style="display: none;">
                    <button class="share-btn" style="background:#00e676; color:#000; margin-top:5px;" onclick="sendCommand('unlock')">🔓 UNLOCK SYSTEM</button>
                    <button class="share-btn" style="background:#29b6f6; color:#000; margin-top:5px;" onclick="sendCommand('start')">⚡ START ENGINE</button>
                    <button class="share-btn" style="background:#ff1744; color:#fff; margin-top:5px;" onclick="sendCommand('lock')">🔒 LOCK / SHUTDOWN</button>
                </div>

                <div id="terminalLog">>> Standby. Waiting for commands...</div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS & Routing Machine JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

    <!-- Firebase v10 Modular SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD2y1CoaxbmmX_mH83GOwQ8eiQLEJ0WYdw",
            databaseURL: "https://keylesstrackerrenz-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "keylesstrackerrenz"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        var map = L.map('map', { zoomControl: false }).setView([14.5995, 120.9842], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        // Marker ng Motor (Pula)
        var motorIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41]
        });
        var motorMarker = L.marker([14.5995, 120.9842], {icon: motorIcon}).addTo(map);
        
        // Marker ng Viewer (Asul na bilog)
        var userMarker = L.circleMarker([0, 0], {
            color: '#29b6f6', fillColor: '#29b6f6', fillOpacity: 0.8, radius: 8
        }).addTo(map);

        var isFirstLoad = true;
        var routeControl = null;
        var motorLatLng = null;
        var userLatLng = null;

        const uiStatus = document.getElementById('ui-status');
        const uiBattery = document.getElementById('ui-battery');
        const uiTime = document.getElementById('ui-time');
        const uiDistance = document.getElementById('ui-distance');
        const loadingScreen = document.getElementById('loading');

        // 1. Kumuha ng Location mula sa Firebase (Motor)
        const locationRef = ref(db, 'location');
        onValue(locationRef, (snapshot) => {
            const data = snapshot.val();
            if (data && data.lat && data.lon) {
                motorLatLng = L.latLng(data.lat, data.lon);
                motorMarker.setLatLng(motorLatLng);

                // Isang beses lang mag-zo-zoom sa motor kapag nag-load ang page
                if(isFirstLoad) { 
                    loadingScreen.style.display = 'none'; 
                    map.flyTo(motorLatLng, 16, { animate: true, duration: 1.5 });
                    // I-trigger ang resize ng mapa pagkatapos itago ang loading screen
                    setTimeout(() => { map.invalidateSize(); }, 500);
                    isFirstLoad = false; 
                }

                uiBattery.innerText = data.battery || "-- V";
                uiTime.innerText = data.last_update || "Just now";

                let stat = data.status || "UNKNOWN";
                uiStatus.innerText = stat;
                uiStatus.className = "info-val"; 
                if (stat.includes("LOCKED")) uiStatus.classList.add("status-locked");
                else if (stat.includes("UNLOCKED")) uiStatus.classList.add("status-unlocked");
                else if (stat.includes("ENGINE")) uiStatus.classList.add("status-engine");

                updateRoute();
            }
        });

        // 2. Kumuha ng Location ng Tumitingin (Cellphone/Viewer)
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(function(position) {
                userLatLng = L.latLng(position.coords.latitude, position.coords.longitude);
                userMarker.setLatLng(userLatLng);
                updateRoute();
            }, function(error) {
                uiDistance.innerText = "Location access denied";
            }, { enableHighAccuracy: true });
        } else {
            uiDistance.innerText = "GPS Not Supported";
        }

        // 3. I-update ang Ruta at Kilometro
        function updateRoute() {
            if (motorLatLng && userLatLng) {
                let distanceMeters = userLatLng.distanceTo(motorLatLng);
                let distanceKm = (distanceMeters / 1000).toFixed(2);
                uiDistance.innerText = distanceKm + " km";

                if (routeControl) {
                    routeControl.setWaypoints([userLatLng, motorLatLng]);
                } else {
                    routeControl = L.Routing.control({
                        waypoints: [userLatLng, motorLatLng],
                        createMarker: function() { return null; }, 
                        routeWhileDragging: false,
                        addWaypoints: false,
                        show: false, 
                        fitSelectedRoutes: false, 
                        lineOptions: { styles: [{color: '#29b6f6', opacity: 0.8, weight: 5}] }
                    }).addTo(map);
                }
            }
        }

        // ==============================================================
        // V23.1 CLOUD COMMAND & TERMINAL LISTENER LOGIC
        // ==============================================================
        const logRef = ref(db, 'cloud_log');
        let lastLogTs = 0;
        
        onValue(logRef, (snapshot) => {
            const data = snapshot.val();
            if (data && data.ts && data.ts > lastLogTs) {
                lastLogTs = data.ts;
                const terminal = document.getElementById('terminalLog');
                terminal.innerHTML += "\n" + data.log;
                terminal.scrollTop = terminal.scrollHeight; // Auto-scroll down

                if (window.isWaitingForReply) {
                    window.isWaitingForReply = false;
                    clearTimeout(window.commandTimeout);
                }

                if (data.log.includes("LOGIN SUCCESS")) {
                    window.isLoggedIn = true;
                    document.getElementById("controlButtons").style.display = "block";
                    const btn = document.getElementById("authBtn");
                    btn.style.background = "#f57c00";
                    btn.innerHTML = "🔓 LOGOUT";
                } 
                else if (data.log.includes("LOGIN FAILED") || data.log.includes("Invalid PIN")) {
                    window.sessionPin = "";
                    window.isLoggedIn = false;
                    alert("Invalid PIN or Master Key!");
                }
            }
        });
    </script>
    
    <!-- Share Button & Cloud Sender Logic -->
    <script>
        function shareLocation() {
            if (navigator.share) {
                navigator.share({
                    title: 'Live Motorcycle Tracker',
                    text: 'Tingnan ang live location at ruta ng motor ko rito:',
                    url: window.location.href
                }).then(() => {
                    console.log('Nai-share nang maayos!');
                }).catch(console.error);
            } else {
                alert("Hindi supported ng browser mo ang Share feature. Kopyahin mo na lang ang link ng website na ito.");
            }
        }

        // ==============================================================
        // V23.1 LOGIN & SENDER LOGIC (WITH SMART TIMEOUT CATCH)
        // ==============================================================
        window.sessionPin = "";
        window.isLoggedIn = false;
        window.commandTimeout = null;
        window.isWaitingForReply = false;

        function appendLocalLog(msg) {
            const term = document.getElementById('terminalLog');
            term.innerHTML += "\n" + msg;
            term.scrollTop = term.scrollHeight;
        }

        function toggleAuth() {
            if (window.isLoggedIn) {
                window.isLoggedIn = false;
                window.sessionPin = "";
                document.getElementById("controlButtons").style.display = "none";
                const btn = document.getElementById("authBtn");
                btn.style.background = "#ab47bc";
                btn.innerHTML = "🔐 LOGIN";
                appendLocalLog(">> CLOUD SESSION: User logged out successfully.");
            } else {
                let pin = prompt("Enter Direct PIN or Master Key:");
                if (pin && pin.trim().length > 0) {
                    window.sessionPin = pin.trim();
                    appendLocalLog(">> CLOUD SESSION: Authenticating PIN via Firebase...");
                    sendCommand("login_check");
                }
            }
        }

        function sendCommand(cmdAction) {
            if (cmdAction !== "login_check" && !window.isLoggedIn) {
                alert("Mag-login muna para maka-access!");
                return;
            }

            let payload = {
                cmd: cmdAction,
                pin: window.sessionPin,
                ts: Date.now()
            };

            fetch("https://keylesstrackerrenz-default-rtdb.asia-southeast1.firebasedatabase.app/cloud_cmd.json", {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).then(res => {
                window.isWaitingForReply = true;
                if (cmdAction !== "login_check") {
                    appendLocalLog(">> ☁️ Sending command [" + cmdAction.toUpperCase() + "] to motor...");
                }
                
                if (window.commandTimeout) clearTimeout(window.commandTimeout);
                
                // SMART TIMEOUT (15-SECONDS)
                window.commandTimeout = setTimeout(() => {
                    if (window.isWaitingForReply) {
                        window.isWaitingForReply = false;
                        appendLocalLog("\n>> ⚠️ CLOUD TIMEOUT: Walang sagot mula sa motor.");
                        appendLocalLog(">> 💡 TIP: Kung naka-ON ang Battery Saver, maaaring nakatulog na ang Wi-Fi. Mag-text sa SIM800L (ex. PING) o gumamit ng RF remote para magising ang system.\n");
                        
                        if(cmdAction === "login_check") window.sessionPin = ""; 
                    }
                }, 15000); 
            }).catch(err => {
                appendLocalLog(">> ❌ NETWORK ERROR: Failed to reach Firebase.");
            });
        }
    </script>
</body>
</html>
